name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc cannot see that a bank leaks its answers through option length, that
      # a correctAnswers entry is missing from choices, or that a reorder answer
      # is alphabetical. This step is the only gate that can, so it runs BEFORE
      # the build rather than after it.
      - name: Check question banks
        run: npm run check:banks

      # The exam draw has no other coverage, and its two failure modes are silent:
      # an allocation tie resolved by sort internals, and case-study questions
      # scattered so their scenario is re-read a dozen times.
      - name: Check the exam draw
        run: npm run verify:exam

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4